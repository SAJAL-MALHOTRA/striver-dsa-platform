services:
  - type: web
    name: striver-dsa-rag
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEFAULT_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
